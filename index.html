<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Profile Card" />
    <meta name="author" content="Ali" />
    <title>Profile Card UI Design</title>
    <link rel="stylesheet" href="./pages/index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="card">
      <div class="card__image">
        <img src="profile.jpg" alt="" class="card__avatar" />
      </div>
      <div class="card__content">
        <span class="card__name">Ali Sidibey</span>
        <span class="card__title">College Student and Coder</span>
      </div>
      <div class="card__social">
        <a href="#" style="background: #4267b2" class="card__social-link">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="#" style="background: #1da1f2" class="card__social-link">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" style="background: #e1306c" class="card__social-link">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="#" style="background: #ff0000" class="card__social-link">
          <i class="fa-solid fa-robot"></i>
        </a>
      </div>

      <div class="card__buttons">
        <button class="card__button">Random</button>
        <button class="card__button">Random</button>
      </div>

      <div class="card__stats">
        <div class="card__stat">
          <i class="fa-solid fa-spider"></i>
          <span class="card__stat-number">10k</span>
        </div>
        <div class="card__stat">
          <i class="fa-solid fa-user-astronaut"></i>
          <span class="card__stat-number">20k</span>
        </div>
        <div class="card__stat">
          <i class="fa-solid fa-meteor"></i>
          <span class="card__stat-number">30k</span>
        </div>
      </div>
    </div>
  </body>
</html>
